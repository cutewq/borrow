<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>設備 QR Code 借還管理系統</title>
  <style>
    body { font-family: "Microsoft JhengHei", sans-serif; background:#f3f4f6; margin:0; padding:20px; color:#1f2937; }
    .container { max-width:820px; margin:0 auto; display:flex; flex-direction:column; gap:16px; }
    .card { background:#fff; border-radius:10px; padding:20px; box-shadow:0 2px 8px rgba(0,0,0,.08); }
    h2 { margin:0 0 12px; font-size:1.15rem; color:#1e40af; border-bottom:2px solid #dbeafe; padding-bottom:8px; }
    h3 { margin:18px 0 8px; font-size:1rem; color:#1e40af; }
    .bar { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
    .row { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
    .group { flex:1; min-width:150px; display:flex; flex-direction:column; }
    label { font-size:.9rem; font-weight:bold; margin-bottom:4px; }
    input, select { padding:9px; border:1px solid #d1d5db; border-radius:6px; font-size:1rem; }
    input[readonly] { background:#e5e7eb; cursor:not-allowed; }
    button { padding:9px 16px; border:none; border-radius:6px; font-size:.95rem; font-weight:bold; cursor:pointer; color:#fff; background:#2563eb; }
    button:disabled { opacity:.6; cursor:not-allowed; }
    .green { background:#059669; } .amber { background:#d97706; } .gray { background:#6b7280; } .red { background:#dc2626; }
    .small { padding:5px 10px; font-size:.82rem; }
    .tabs { display:flex; gap:8px; flex-wrap:wrap; }
    .tabs button { background:#e5e7eb; color:#374151; }
    .tabs button.active { background:#2563eb; color:#fff; }
    .locked { opacity:.5; pointer-events:none; }
    .hidden { display:none !important; }
    .msg { margin-top:10px; font-weight:bold; white-space:pre-line; }
    .scroll { overflow-x:auto; }
    #reader { width:100%; max-width:360px; margin:0 auto 10px; }
    table { width:100%; border-collapse:collapse; font-size:.9rem; }
    th, td { border:1px solid #e5e7eb; padding:7px; text-align:left; }
    th { background:#dbeafe; color:#1e40af; white-space:nowrap; }
  </style>
</head>
<body>
<div class="container">

  <!-- 登入狀態列 -->
  <div class="card">
    <div class="bar" id="outBar">
      <span>⚠️ 尚未登入，請先登入後再使用。</span>
      <button onclick="window.open('login.html','_blank')">另開分頁登入</button>
    </div>
    <div class="bar hidden" id="inBar">
      <div>✅ <strong id="uName"></strong>（帳號：<span id="uId"></span> / 角色：<span id="uRole"></span>）</div>
      <div>
        <button class="gray small" onclick="togglePw()">變更密碼</button>
        <button class="gray small" onclick="logout()">登出</button>
      </div>
    </div>
  </div>

  <!-- 變更密碼 -->
  <div class="card hidden" id="pwCard">
    <h2>🔑 變更密碼</h2>
    <div id="pwNotice" class="msg hidden" style="color:#d97706;margin:0 0 10px">這是您的初始或重設密碼，請先設定新密碼才能繼續使用。</div>
    <div class="row">
      <div class="group"><label>目前密碼</label><input type="password" id="oldPw" autocomplete="current-password" /></div>
      <div class="group"><label>新密碼（至少 6 個字元）</label><input type="password" id="newPw" autocomplete="new-password" /></div>
      <div class="group"><label>再輸入一次新密碼</label><input type="password" id="newPw2" autocomplete="new-password" /></div>
    </div>
    <button onclick="changePw()">更新密碼</button>
    <div id="pwMsg" class="msg"></div>
    <div style="margin-top:8px;font-size:.8rem;color:#6b7280">改完密碼後若又跳回此畫面，請查看頁面最下方的「後端版本」是否為 v3.1。</div>
  </div>

  <!-- 分頁按鈕 -->
  <div class="tabs hidden" id="tabs">
    <button data-tab="opTab" class="active">📦 借還登記</button>
    <button data-tab="recTab">📋 借還紀錄</button>
    <button data-tab="adminTab" id="adminBtn" class="hidden">🛠 管理</button>
  </div>

  <!-- 借還登記 -->
  <div class="card hidden" id="opTab">
    <h2>📦 設備借還登記</h2>
    <div class="row">
      <div class="group"><label>操作人（自動帶入）</label><input type="text" id="opName" readonly /></div>
      <div class="group"><label>設備編號（可掃描 QR Code）</label><input type="text" id="eqId" placeholder="請輸入或掃描設備編號" /></div>
    </div>
    <div class="row"><button class="gray" onclick="startScan()">📷 掃描 QR Code</button></div>
    <div id="scanBox" class="hidden">
      <div id="reader"></div>
      <div style="text-align:center"><button class="red small" onclick="stopScan()">關閉相機</button></div>
    </div>
    <div class="row">
      <button class="green" id="bBorrow" onclick="act('borrow')">確認借用</button>
      <button class="amber" id="bReturn" onclick="act('return')">確認歸還</button>
    </div>
    <div id="opMsg" class="msg"></div>
  </div>

  <!-- 借還紀錄 -->
  <div class="card hidden" id="recTab">
    <h2>📋 借還紀錄 <span id="recHint" style="font-size:.8rem;color:#6b7280;font-weight:normal"></span></h2>
    <div class="row">
      <div class="group" style="max-width:220px"><label>篩選</label>
        <select id="recFilter" onchange="loadRecords()">
          <option value="all">全部（最近 20 筆）</option>
          <option value="outstanding">只看尚未歸還</option>
        </select>
      </div>
    </div>
    <div class="scroll"><table>
      <thead><tr><th>設備編號</th><th>設備名稱</th><th>借用人</th><th>借用時間</th><th>歸還人</th><th>歸還時間</th></tr></thead>
      <tbody id="recBody"></tbody>
    </table></div>
  </div>

  <!-- 管理 -->
  <div class="card hidden" id="adminTab">
    <h2>🛠 管理員功能</h2>

    <h3>使用者</h3>
    <div class="row">
      <div class="group"><label>帳號</label><input id="auId" /></div>
      <div class="group"><label>姓名</label><input id="auName" /></div>
      <div class="group"><label>角色</label>
        <select id="auRole"><option value="student">student</option><option value="teacher">teacher</option><option value="admin">admin</option></select></div>
      <div class="group"><label>狀態</label>
        <select id="auStatus"><option value="">啟用</option><option value="不啟用">不啟用</option></select></div>
    </div>
    <button class="green" onclick="saveUser()">新增／更新使用者</button>
    <div id="auMsg" class="msg"></div>
    <div class="scroll" style="margin-top:10px"><table>
      <thead><tr><th>帳號</th><th>姓名</th><th>角色</th><th>狀態</th><th>需改密碼</th><th>操作</th></tr></thead>
      <tbody id="userBody"></tbody>
    </table></div>

    <h3>設備</h3>
    <div class="row">
      <div class="group"><label>設備編號</label><input id="aeId" /></div>
      <div class="group"><label>設備名稱</label><input id="aeName" /></div>
      <div class="group"><label>廠牌</label><input id="aeBrand" /></div>
      <div class="group"><label>狀態</label>
        <select id="aeStatus"><option value="可借用">可借用</option><option value="維修中">維修中</option></select></div>
    </div>
    <button class="green" onclick="saveEquipment()">新增／更新設備</button>
    <div id="aeMsg" class="msg"></div>
    <div class="scroll" style="margin-top:10px"><table>
      <thead><tr><th>設備編號</th><th>設備名稱</th><th>廠牌</th><th>狀態</th><th>操作</th></tr></thead>
      <tbody id="eqBody"></tbody>
    </table></div>
  </div>

  <div id="ver" style="text-align:center;color:#6b7280;font-size:.8rem"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script>
  // ⚠️ 請換成你的 Google Apps Script 部署網址（需與 login.html 相同）
  const API_URL = "https://script.google.com/macros/s/AKfycbz22YkMiPQ898V1KmkQ5E3nMhHzQUTUQDG3TbMdE7CmJs42JbDufwyZjwM6XkxiWUXb/exec";
  const KEY = "loggedInUser";
  const ROLE_LABEL = { admin: "管理員", teacher: "老師", student: "學生" };
  let me = null;

  const $ = id => document.getElementById(id);
  function h(tag, props, ...kids) {
    const e = document.createElement(tag);
    Object.entries(props || {}).forEach(([k, v]) => {
      if (k === "text") e.textContent = v;
      else if (k === "onclick") e.onclick = v;
      else e.setAttribute(k, v);
    });
    kids.forEach(k => e.append(k));
    return e;
  }
  function say(id, color, text) { const el = $(id); el.style.color = color; el.textContent = text; }

  /* ---------- 登入狀態 ---------- */
  window.addEventListener("DOMContentLoaded", () => {
    syncUser();
    const pre = new URLSearchParams(location.search).get("id");
    if (pre) $("eqId").value = pre.trim();
    api({ action: "ping" }).then(r => { $("ver").textContent = "後端版本：" + (r.version || "未知（請重新部署）"); })
      .catch(() => { $("ver").textContent = "後端版本：無法連線"; });
  });
  window.addEventListener("storage", e => { if (e.key === KEY) syncUser(); });

  function syncUser() {
    let u = null;
    try { u = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
    me = (u && u.token) ? u : null;

    $("outBar").classList.toggle("hidden", !!me);
    $("inBar").classList.toggle("hidden", !me);
    $("tabs").classList.toggle("hidden", !me);
    if (!me) {
      ["pwCard", "opTab", "recTab", "adminTab"].forEach(i => $(i).classList.add("hidden"));
      return;
    }
    $("uName").textContent = me.name;
    $("uId").textContent = me.user_id;
    $("uRole").textContent = ROLE_LABEL[me.role] || me.role;
    $("opName").value = me.name;
    $("adminBtn").classList.toggle("hidden", me.role !== "admin");
    $("pwNotice").classList.toggle("hidden", !me.mustChange);

    if (me.mustChange) {
      $("tabs").classList.add("hidden");
      ["opTab", "recTab", "adminTab"].forEach(i => $(i).classList.add("hidden"));
      $("pwCard").classList.remove("hidden");
    } else {
      if ($("pwCard").dataset.manual !== "1") $("pwCard").classList.add("hidden");
      showTab(document.querySelector(".tabs button.active").dataset.tab);
    }
  }

  function showTab(id) {
    if (id !== "opTab") stopScan();
    document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === id));
    ["opTab", "recTab", "adminTab"].forEach(t => $(t).classList.toggle("hidden", t !== id));
    if (id === "recTab") loadRecords();
    if (id === "adminTab") { loadUsers(); loadEquipment(); }
  }
  document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => showTab(b.dataset.tab));

  function setLocal(patch) {
    me = Object.assign({}, me, patch);
    localStorage.setItem(KEY, JSON.stringify(me));
    syncUser();
  }
  function forceLogout() {
    stopScan(); localStorage.removeItem(KEY); syncUser(); }
  async function logout() {
    try { await api({ action: "logout" }); } catch (e) {}
    forceLogout();
  }

  /* ---------- API ---------- */
  async function api(payload) {
    payload.token = me ? me.token : "";
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });
    let data;
    try { data = JSON.parse(await res.text()); }
    catch (e) { throw new Error("後端回傳格式不正確，請確認 API_URL 與部署設定。"); }
    if (data.code === "AUTH") forceLogout();
    if (data.code === "MUSTCHANGE" && me) setLocal({ mustChange: true });
    return data;
  }

  /* ---------- 變更密碼 ---------- */
  function togglePw() {
    const c = $("pwCard");
    const show = c.classList.contains("hidden");
    c.classList.toggle("hidden", !show);
    c.dataset.manual = show ? "1" : "0";
    $("pwMsg").textContent = "";
  }
  async function changePw() {
    const o = $("oldPw").value, n = $("newPw").value, n2 = $("newPw2").value;
    if (!o || !n) return say("pwMsg", "#dc2626", "請輸入目前密碼與新密碼。");
    if (n !== n2) return say("pwMsg", "#dc2626", "兩次輸入的新密碼不一致。");
    say("pwMsg", "#2563eb", "處理中...");
    try {
      const r = await api({ action: "changePassword", oldPassword: o, newPassword: n });
      if (r.success) {
        ["oldPw", "newPw", "newPw2"].forEach(i => $(i).value = "");
        $("pwCard").dataset.manual = "0";
        say("pwMsg", "#059669", r.message);
        setLocal({ mustChange: false });
      } else say("pwMsg", "#dc2626", r.message);
    } catch (e) { say("pwMsg", "#dc2626", "操作失敗：" + e.message); }
  }

  /* ---------- 借還 ---------- */
  async function act(type) {
    const id = $("eqId").value.trim();
    if (!id) return say("opMsg", "#dc2626", "請輸入或掃描設備編號。");
    const btns = [$("bBorrow"), $("bReturn")];
    btns.forEach(b => b.disabled = true);
    say("opMsg", "#2563eb", "處理中...");
    try {
      const r = await api({ action: type, id });
      if (r.success) {
        say("opMsg", "#059669", r.message + "（" + r.equipmentName + " / 操作人：" + r.person + "）");
        $("eqId").value = "";
      } else say("opMsg", "#dc2626", r.message);
    } catch (e) { say("opMsg", "#dc2626", "操作失敗：" + e.message); }
    finally { btns.forEach(b => b.disabled = false); }
  }
  /* ---------- QR Code 掃描 ---------- */
  let scanner = null;
  function parseCode(txt) {
    txt = String(txt || "").trim();
    try { const id = new URL(txt).searchParams.get("id"); if (id) return id.trim(); } catch (e) {}
    return txt;
  }
  async function startScan() {
    if (typeof Html5Qrcode === "undefined") return say("opMsg", "#dc2626", "掃描元件載入失敗，請檢查網路，或改用手動輸入設備編號。");
    if (scanner) return;
    $("scanBox").classList.remove("hidden");
    scanner = new Html5Qrcode("reader");
    try {
      await scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 220, height: 220 } },
        text => {
          const id = parseCode(text);
          $("eqId").value = id;
          stopScan();
          say("opMsg", "#059669", "已掃描設備編號：" + id + "\n請按「確認借用」或「確認歸還」。");
        }, () => {});
    } catch (e) {
      scanner = null;
      $("scanBox").classList.add("hidden");
      say("opMsg", "#dc2626", "無法開啟相機：請允許瀏覽器使用相機，並確認網址是 https:// 開頭。");
    }
  }
  async function stopScan() {
    const sc = scanner; scanner = null;
    if (sc) { try { await sc.stop(); } catch (e) {} try { sc.clear(); } catch (e) {} }
    $("scanBox").classList.add("hidden");
  }

  $("eqId").addEventListener("keydown", e => { if (e.key === "Enter") act("borrow"); });

  /* ---------- 紀錄 ---------- */
  async function loadRecords() {
    if (!me) return;
    $("recHint").textContent = me.role === "student" ? "（僅顯示您本人的紀錄）" : "";
    const body = $("recBody");
    try {
      const r = await api({ action: "getHistory", filter: $("recFilter").value });
      body.replaceChildren();
      if (!r.success) return body.append(row([r.message], 6));
      const list = r.records.slice(0, 20);
      if (!list.length) return body.append(row(["目前沒有符合的紀錄"], 6));
      list.forEach(x => body.append(row([x.id, x.equipmentName, x.borrower, x.borrowTime, x.returner || "-", x.returnTime || "尚未歸還"])));
    } catch (e) { body.replaceChildren(row(["載入失敗：" + e.message], 6)); }
  }
  function row(cells, span) {
    const tr = h("tr");
    cells.forEach(c => tr.append(h("td", { text: c, ...(span ? { colspan: span } : {}) })));
    return tr;
  }

  /* ---------- 管理：使用者 ---------- */
  async function loadUsers() {
    const body = $("userBody");
    try {
      const r = await api({ action: "adminListUsers" });
      body.replaceChildren();
      if (!r.success) return body.append(row([r.message], 6));
      r.users.forEach(u => {
        const tr = row([u.user_id, u.name, u.role, u.status || "啟用", u.mustChange ? "是" : ""]);
        tr.append(h("td", {},
          h("button", { class: "gray small", text: "編輯", onclick: () => {
            $("auId").value = u.user_id; $("auName").value = u.name;
            $("auRole").value = u.role; $("auStatus").value = u.status;
          }}),
          " ",
          h("button", { class: "amber small", text: "重設密碼", onclick: () => resetPw(u) })
        ));
        body.append(tr);
      });
    } catch (e) { body.replaceChildren(row(["載入失敗：" + e.message], 6)); }
  }
  async function saveUser() {
    say("auMsg", "#2563eb", "處理中...");
    try {
      const r = await api({ action: "adminSaveUser", user_id: $("auId").value, name: $("auName").value,
                            role: $("auRole").value, status: $("auStatus").value });
      if (r.success) {
        say("auMsg", "#059669", r.message + (r.tempPassword ? "\n臨時密碼：" + r.tempPassword + "（請私下告知對方，登入後需改密碼）" : ""));
        loadUsers();
      } else say("auMsg", "#dc2626", r.message);
    } catch (e) { say("auMsg", "#dc2626", "操作失敗：" + e.message); }
  }
  async function resetPw(u) {
    if (!confirm("確定要重設 " + u.name + "（" + u.user_id + "）的密碼嗎？")) return;
    try {
      const r = await api({ action: "adminResetPassword", user_id: u.user_id });
      say("auMsg", r.success ? "#059669" : "#dc2626",
          r.success ? u.name + " 的臨時密碼：" + r.tempPassword + "（請私下告知對方）" : r.message);
      if (r.success) loadUsers();
    } catch (e) { say("auMsg", "#dc2626", "操作失敗：" + e.message); }
  }

  /* ---------- 管理：設備 ---------- */
  async function loadEquipment() {
    const body = $("eqBody");
    try {
      const r = await api({ action: "adminListEquipment" });
      body.replaceChildren();
      if (!r.success) return body.append(row([r.message], 5));
      r.equipment.forEach(e => {
        const tr = row([e.id, e.equipmentName, e.brand, e.status]);
        tr.append(h("td", {}, h("button", { class: "gray small", text: "編輯", onclick: () => {
          $("aeId").value = e.id; $("aeName").value = e.equipmentName; $("aeBrand").value = e.brand;
          if (e.status === "可借用" || e.status === "維修中") $("aeStatus").value = e.status;
        }})));
        body.append(tr);
      });
    } catch (e) { body.replaceChildren(row(["載入失敗：" + e.message], 5)); }
  }
  async function saveEquipment() {
    say("aeMsg", "#2563eb", "處理中...");
    try {
      const r = await api({ action: "adminSaveEquipment", id: $("aeId").value, equipmentName: $("aeName").value,
                            brand: $("aeBrand").value, status: $("aeStatus").value });
      say("aeMsg", r.success ? "#059669" : "#dc2626", r.message);
      if (r.success) loadEquipment();
    } catch (e) { say("aeMsg", "#dc2626", "操作失敗：" + e.message); }
  }
</script>
</body>
</html>
